apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "umpay.fullname" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "UmPay": {
        "PaymentApiUrl": "{{ .Values.paymentApiUrl  }}",
        "NatsUrl": "{{ .Values.nats }}",
        "CallbackBaseUrl": "{{ .Values.callbackBaseUrl }}",
        "PaymentServiceBaseUrl": "{{ .Values.paymentServiceBaseUrl  }}",
        "Expire": "{{ .Values.expire }}"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
