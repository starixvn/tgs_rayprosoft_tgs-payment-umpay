# Default values for eeziepay.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:  
  repository: pgtgs/payment-umpay
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets:
  - name: dockerhub
nameOverride: "payment-umpay"
fullnameOverride: "payment-umpay"

nats: nats://localhost:4222
paymentApiUrl: https://hk-dev.playpay.vip
callbackBaseUrl: https://dev-payment.rpgp.cc/umpay
paymentServiceBaseUrl: http://payment-api
expire: 01:00:00

podAnnotations: 
  prometheus.io/path: /metrics
  prometheus.io/port: "52325"
  prometheus.io/scrape: "true"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 400m
    memory: 200Mi
  requests:
    cpu: 50m
    memory: 50Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80


nodeSelector: {}

tolerations: []

affinity: {}
